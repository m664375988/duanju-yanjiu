name: 自动写文并部署

on:
  schedule:
    # 北京时间每周一 09:00 = UTC 周一 01:00
    - cron: '0 1 * * 1'
  workflow_dispatch: {}   # 允许在 GitHub 网页手动触发（用于首次验证）

permissions:
  contents: write      # 写回新生成的文章
  pages: write         # 部署 GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      SITE_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 自动写文（智谱 GLM）
        run: python auto_write.py

      - name: 构建静态站
        run: python build.py

      - name: 把新文章提交回仓库
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --cached --quiet; then
            echo "无新文章，跳过提交"
          else
            git commit -m "auto: 新增文章 $(date +%F)"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 提交 IndexNow（Bing 收录）
        run: python submit_indexnow.py
